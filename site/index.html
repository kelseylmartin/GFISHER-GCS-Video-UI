<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Library Portal</title>
    
    <!-- Tailwind CSS & Config for Dark Mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Modal Video Transitions */
        #marineVideo { transition: transform 0.1s ease-out; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans h-screen flex overflow-hidden transition-colors duration-200">
    
    <!-- LEFT SIDEBAR (Collapsible File Explorer) -->
    <aside class="w-72 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col flex-shrink-0 transition-colors duration-200">
        <div class="p-4 border-b border-slate-200 dark:border-slate-700">
            <h2 class="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                Directories
            </h2>
        </div>
        <div class="flex-1 overflow-y-auto p-2" id="folderList">
            <!-- Folder tree injected via JS -->
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col min-w-0">
        
        <!-- HEADER -->
        <header class="bg-white dark:bg-slate-800 shadow-sm z-10 transition-colors duration-200">
            <div class="px-6 py-4 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                
                <!-- Title & Icon -->
                <div class="flex items-center gap-4">
                    <div class="p-2.5 bg-blue-100 dark:bg-blue-900/50 rounded-xl text-blue-600 dark:text-blue-400 shadow-sm">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Video Library Portal</h1>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Browse and stream videos directly from Cloud Storage</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-4">
                    <!-- Search Bar -->
                    <div class="w-full lg:w-80 relative">
                        <input 
                            type="text" id="searchInput" disabled placeholder="Search by name or tags..." 
                            class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white disabled:opacity-50 transition-colors"
                        >
                        <svg class="w-5 h-5 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>

                    <!-- Dark Mode Toggle -->
                    <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors" title="Toggle Dark Mode">
                        <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- SCROLLABLE VIDEO GRID AREA -->
        <main class="flex-1 overflow-y-auto p-6" id="mainScrollArea">
            
            <div id="loadingState" class="flex flex-col items-center justify-center py-20">
                <svg class="animate-spin h-10 w-10 text-blue-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <p class="text-slate-500 dark:text-slate-400">Loading video data...</p>
            </div>

            <div id="errorState" class="hidden text-center py-16 max-w-2xl mx-auto bg-red-50 dark:bg-red-900/20 rounded-xl border border-red-100 dark:border-red-800 p-8 shadow-sm">
                <h3 class="text-xl font-bold text-red-800 dark:text-red-400 mb-2">No Video Data Found</h3>
                <p class="text-red-600 dark:text-red-300">The `data.js` file could not be loaded or is empty.</p>
            </div>

            <div id="videoGrid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-8">
                <!-- Cards injected via JS -->
            </div>

            <div id="paginationControls" class="hidden flex justify-center items-center gap-2 mt-8 mb-4"></div>

            <div id="emptySearchState" class="hidden text-center py-20">
                <p class="text-slate-500 dark:text-slate-400 text-lg">No videos match your selection.</p>
            </div>

        </main>
    </div>

    <!-- SVG Filter for Sharpening -->
    <svg style="display: none;">
        <defs>
            <filter id="sharpen">
                <feConvolveMatrix order="3" preserveAlpha="true" kernelMatrix=" 0 -1 0  -1 5 -1  0 -1 0"/>
            </filter>
        </defs>
    </svg>

    <!-- VIDEO PLAYER MODAL -->
    <div id="videoModal" class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-5xl bg-white dark:bg-slate-800 rounded-t-xl p-4 flex flex-wrap items-center justify-between gap-4 shadow-lg transition-colors">
            
            <div class="flex flex-wrap items-center gap-4 text-sm font-medium text-slate-700 dark:text-slate-300">
                <label class="flex items-center gap-2">Brightness <input type="range" id="toolBrightness" min="0.5" max="3" step="0.1" value="1" class="w-24"></label>
                <label class="flex items-center gap-2">Contrast <input type="range" id="toolContrast" min="0.5" max="3" step="0.1" value="1" class="w-24"></label>
                <label class="flex items-center gap-2">Speed
                    <select id="toolSpeed" class="border dark:border-slate-600 rounded p-1 text-sm bg-slate-50 dark:bg-slate-700">
                        <option value="0.25">0.25x</option><option value="0.5">0.5x</option>
                        <option value="1" selected>1.0x</option><option value="1.5">1.5x</option><option value="2">2.0x</option>
                    </select>
                </label>
                <label class="flex items-center gap-2 cursor-pointer ml-2 bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 px-3 py-1 rounded-full border border-blue-200 dark:border-blue-800">
                    <input type="checkbox" id="toolSharpen"> Upscale/Sharpen
                </label>
            </div>
            <button onclick="closeVideoModal()" class="text-slate-500 dark:text-slate-400 hover:text-red-500 dark:hover:text-red-400 font-bold px-3 py-1 bg-slate-100 dark:bg-slate-700 rounded-lg transition">Close (X)</button>
        </div>
        <div class="w-full max-w-5xl bg-black text-center text-xs text-slate-400 py-2 border-b border-slate-800">
            *Scroll mouse wheel over video to zoom. Click and drag to pan around.
        </div>
        <div class="w-full max-w-5xl aspect-video bg-black relative overflow-hidden cursor-grab rounded-b-xl border border-slate-800" id="vidContainer">
            <video id="marineVideo" src="" controls class="w-full h-full object-contain origin-top-left"></video>
        </div>
    </div>

    <script>
        // DOM Elements
        const grid = document.getElementById('videoGrid');
        const searchInput = document.getElementById('searchInput');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const emptySearchState = document.getElementById('emptySearchState');
        const paginationControls = document.getElementById('paginationControls');
        const folderListContainer = document.getElementById('folderList');
        const mainScrollArea = document.getElementById('mainScrollArea');

        // State Management
        let allVideos = [];
        let filteredVideos = [];
        let currentPage = 1;
        const itemsPerPage = 12;
        let selectedFolder = ""; // Empty string means "All Videos"

        // --- DARK MODE LOGIC ---
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // --- COLLAPSIBLE DIRECTORY TREE LOGIC ---
        function buildFolderExplorer() {
            if (allVideos.length === 0) return;

            // 1. Find the common parent folders to ignore
            let minLen = Math.min(...allVideos.map(v => v.tiersArray.length));
            let commonPrefixLen = 0;
            
            for (let i = 0; i < minLen; i++) {
                let val = allVideos[0].tiersArray[i];
                if (allVideos.every(v => v.tiersArray[i] === val)) {
                    commonPrefixLen++;
                } else break;
            }

            // 2. Extract unique relative folder paths
            let folderPaths = new Set();
            allVideos.forEach(v => {
                v.relPathArray = v.tiersArray.slice(commonPrefixLen);
                v.folderPath = v.relPathArray.join('/'); // e.g. "Cruise1/CameraA"
                if (v.folderPath) folderPaths.add(v.folderPath);
            });

            // 3. Build a nested tree object
            const root = { children: {}, path: "" };
            folderPaths.forEach(path => {
                const parts = path.split('/');
                let current = root;
                let currentPath = "";
                parts.forEach((part, i) => {
                    currentPath += (i === 0 ? part : '/' + part);
                    if (!current.children[part]) {
                        current.children[part] = { name: part, path: currentPath, children: {} };
                    }
                    current = current.children[part];
                });
            });

            // 4. Recursive HTML Generation
            function renderTree(node, depth = 0) {
                let html = '';
                const keys = Object.keys(node.children).sort();
                
                keys.forEach(key => {
                    const child = node.children[key];
                    const hasChildren = Object.keys(child.children).length > 0;
                    const padding = (depth * 1.25) + 0.75;
                    // Base64 encoding creates safe IDs avoiding quotes or spaces
                    const safeId = btoa(child.path).replace(/[^a-zA-Z0-9]/g, ''); 
                    
                    html += `<div class="folder-node">`;
                    
                    html += `
                        <button data-path="${child.path}" onclick="toggleFolder(this, '${child.path}', '${safeId}')" 
                            style="padding-left: ${padding}rem"
                            class="folder-btn w-full text-left pr-3 py-1.5 rounded-lg mb-1 text-sm transition-colors text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50 flex items-center gap-2 truncate group">
                            
                            ${hasChildren 
                                ? `<svg id="icon-${safeId}" class="w-4 h-4 flex-shrink-0 transition-transform duration-200 -rotate-90 text-slate-400 group-hover:text-slate-600 dark:group-hover:text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>` 
                                : `<svg class="w-4 h-4 flex-shrink-0 opacity-40 text-slate-500" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>`}
                            
                            ${child.name}
                        </button>
                    `;
                    
                    if (hasChildren) {
                        html += `<div class="folder-children hidden" id="children-${safeId}">`;
                        html += renderTree(child, depth + 1);
                        html += `</div>`;
                    }
                    
                    html += `</div>`;
                });
                return html;
            }

            // 5. Render "All Videos" + The Tree
            let html = `
                <button data-path="" onclick="selectAllFolders(this)" class="folder-btn w-full text-left px-3 py-2 rounded-lg mb-2 text-sm transition-colors bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 font-semibold flex items-center gap-2">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    All Videos
                </button>
            `;
            html += renderTree(root, 0);

            folderListContainer.innerHTML = html;
        }

        window.toggleFolder = function(btnElement, path, safeId) {
            selectedFolder = path;
            
            // Highlight active folder
            document.querySelectorAll('.folder-btn').forEach(btn => {
                btn.classList.remove('bg-blue-50', 'dark:bg-blue-900/30', 'text-blue-700', 'dark:text-blue-400', 'font-semibold');
                btn.classList.add('text-slate-600', 'dark:text-slate-400');
            });
            btnElement.classList.remove('text-slate-600', 'dark:text-slate-400');
            btnElement.classList.add('bg-blue-50', 'dark:bg-blue-900/30', 'text-blue-700', 'dark:text-blue-400', 'font-semibold');

            // Expand or Collapse Sub-directories if they exist
            if (safeId) {
                const childrenContainer = document.getElementById(`children-${safeId}`);
                const icon = document.getElementById(`icon-${safeId}`);
                if (childrenContainer) {
                    childrenContainer.classList.toggle('hidden');
                    if (icon) {
                        icon.classList.toggle('-rotate-90');
                    }
                }
            }

            applyFilters();
        };

        window.selectAllFolders = function(btnElement) {
            selectedFolder = "";
            document.querySelectorAll('.folder-btn').forEach(btn => {
                btn.classList.remove('bg-blue-50', 'dark:bg-blue-900/30', 'text-blue-700', 'dark:text-blue-400', 'font-semibold');
                btn.classList.add('text-slate-600', 'dark:text-slate-400');
            });
            btnElement.classList.remove('text-slate-600', 'dark:text-slate-400');
            btnElement.classList.add('bg-blue-50', 'dark:bg-blue-900/30', 'text-blue-700', 'dark:text-blue-400', 'font-semibold');
            applyFilters();
        };

        // --- FILTER & RENDER LOGIC ---
        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase();
            
            filteredVideos = allVideos.filter(video => {
                let matchesFolder = true;
                if (selectedFolder !== "") {
                    // Match exact folder or a subfolder of it
                    matchesFolder = video.folderPath === selectedFolder || video.folderPath.startsWith(selectedFolder + '/');
                }
                
                let matchesSearch = true;
                if (searchTerm) {
                    const matchesName = video.filename.toLowerCase().includes(searchTerm);
                    const matchesTags = video.tiersArray.some(tier => tier.toLowerCase().includes(searchTerm));
                    matchesSearch = matchesName || matchesTags;
                }

                return matchesFolder && matchesSearch;
            });
            
            currentPage = 1; 
            renderVideos();
        }

        // --- PAGINATION ---
        function renderPagination() {
            const totalPages = Math.ceil(filteredVideos.length / itemsPerPage);
            if (totalPages <= 1) {
                paginationControls.classList.add('hidden');
                return;
            }
            
            paginationControls.classList.remove('hidden');
            let html = '';
            
            const prevDisabled = currentPage === 1;
            html += `<button onclick="goToPage(${currentPage - 1})" ${prevDisabled ? 'disabled' : ''} class="px-3 py-1.5 rounded-md border border-slate-200 dark:border-slate-700 font-medium ${prevDisabled ? 'text-slate-400 dark:text-slate-500 cursor-not-allowed' : 'bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors'}">Prev</button>`;
            
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + 4);
            if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

            for (let i = startPage; i <= endPage; i++) {
                const isActive = i === currentPage;
                html += `<button onclick="goToPage(${i})" class="px-3 py-1.5 rounded-md border font-medium transition-colors ${isActive ? 'bg-blue-600 text-white border-blue-600' : 'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700'}">${i}</button>`;
            }
            
            const nextDisabled = currentPage === totalPages;
            html += `<button onclick="goToPage(${currentPage + 1})" ${nextDisabled ? 'disabled' : ''} class="px-3 py-1.5 rounded-md border border-slate-200 dark:border-slate-700 font-medium ${nextDisabled ? 'text-slate-400 dark:text-slate-500 cursor-not-allowed' : 'bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors'}">Next</button>`;
            
            paginationControls.innerHTML = html;
        }

        window.goToPage = function(page) {
            const totalPages = Math.ceil(filteredVideos.length / itemsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderVideos();
            mainScrollArea.scrollTo({ top: 0, behavior: 'smooth' }); 
        };

        // --- RENDER CARDS ---
        function renderVideos() {
            grid.innerHTML = ''; 
            if (filteredVideos.length === 0) {
                grid.classList.add('hidden');
                paginationControls.classList.add('hidden');
                emptySearchState.classList.remove('hidden');
                return;
            }

            emptySearchState.classList.add('hidden');
            grid.classList.remove('hidden');

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, filteredVideos.length);
            const pageVideos = filteredVideos.slice(startIndex, endIndex);

            pageVideos.forEach(video => {
                const displayPath = video.folderPath ? video.folderPath.replace(/\//g, " <span class='text-slate-300 dark:text-slate-600'>/</span> ") : "Root Directory";

                const cardHtml = `
                    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden hover:shadow-md transition-shadow flex flex-col">
                        <div class="p-5 flex-grow">
                            <div class="text-xs font-mono text-slate-500 dark:text-slate-400 mb-2 truncate" title="${video.folderPath}">
                                ${displayPath}
                            </div>
                            <h3 class="font-semibold text-slate-800 dark:text-white text-lg mb-2 line-clamp-2" title="${video.filename.replace(/"/g, '&quot;')}">${video.filename}</h3>
                        </div>
                        <div class="px-5 py-4 bg-slate-50 dark:bg-slate-900/50 border-t border-slate-100 dark:border-slate-700">
                            <button onclick="openVideoModal('${video.url}')" class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" fill-rule="evenodd"></path></svg>
                                Play Interactive
                            </button>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
            renderPagination();
        }

        // --- INIT ---
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }

            if (typeof masterVideoData !== 'undefined' && Array.isArray(masterVideoData)) {
                loadingState.classList.add('hidden');
                if (masterVideoData.length > 0) {
                    allVideos = masterVideoData;
                    filteredVideos = [...allVideos]; 
                    searchInput.disabled = false;
                    
                    buildFolderExplorer();
                    renderVideos();
                } else {
                    errorState.querySelector('h3').textContent = "Bucket is Empty";
                    errorState.classList.remove('hidden');
                }
            } else {
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
            }
            initVideoTools(); 
        });

        let searchTimeout;
        searchInput.addEventListener('input', () => {
            if (allVideos.length === 0) return;
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => { applyFilters(); }, 250);
        });

        // --- MODAL & TOOLS ---
        const videoModal = document.getElementById('videoModal');
        const marineVideo = document.getElementById('marineVideo');
        
        window.openVideoModal = function(url) {
            marineVideo.src = url;
            videoModal.classList.remove('hidden');
            marineVideo.play().catch(e => console.log("Autoplay prevented:", e));
        };

        window.closeVideoModal = function() {
            videoModal.classList.add('hidden');
            marineVideo.pause();
            marineVideo.src = "";
            resetVideoTools(); 
        };

        function initVideoTools() {
            const container = document.getElementById('vidContainer');
            const brightInput = document.getElementById('toolBrightness');
            const contrastInput = document.getElementById('toolContrast');
            const speedInput = document.getElementById('toolSpeed');
            const sharpenInput = document.getElementById('toolSharpen');

            function updateFilters() {
                let filterString = `brightness(${brightInput.value}) contrast(${contrastInput.value})`;
                if (sharpenInput.checked) filterString += ` url(#sharpen)`;
                marineVideo.style.filter = filterString;
            }

            brightInput.addEventListener('input', updateFilters);
            contrastInput.addEventListener('input', updateFilters);
            sharpenInput.addEventListener('change', updateFilters);

            speedInput.addEventListener('change', (e) => {
                marineVideo.playbackRate = parseFloat(e.target.value);
            });

            let scale = 1, panning = false, pointX = 0, pointY = 0, startX = 0, startY = 0;

            function setTransform() {
                marineVideo.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
            }

            window.resetVideoTools = function() {
                scale = 1; pointX = 0; pointY = 0; setTransform();
                brightInput.value = 1; contrastInput.value = 1;
                speedInput.value = "1"; sharpenInput.checked = false;
                updateFilters();
                marineVideo.playbackRate = 1;
            };

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = -e.deltaY * 0.005;
                const newScale = Math.min(Math.max(1, scale + zoomFactor), 5); 
                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                if (newScale !== scale) {
                    pointX = mouseX - (mouseX - pointX) * (newScale / scale);
                    pointY = mouseY - (mouseY - pointY) * (newScale / scale);
                    scale = newScale;
                    if (scale === 1) { pointX = 0; pointY = 0; }
                    setTransform();
                }
            });

            container.addEventListener('mousedown', (e) => {
                if (scale > 1) {
                    e.preventDefault();
                    startX = e.clientX - pointX;
                    startY = e.clientY - pointY;
                    panning = true;
                    container.style.cursor = 'grabbing';
                }
            });

            container.addEventListener('mousemove', (e) => {
                if (!panning) return;
                pointX = e.clientX - startX;
                pointY = e.clientY - startY;
                setTransform();
            });

            const stopPanning = () => { panning = false; container.style.cursor = 'grab'; };
            container.addEventListener('mouseup', stopPanning);
            container.addEventListener('mouseleave', stopPanning);
        }
    </script>
</body>
</html>
